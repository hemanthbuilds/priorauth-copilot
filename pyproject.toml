# Project metadata and pinned dependencies. Install with: uv sync
[project]
name = "priorauth-copilot"
version = "0.1.0"
description = "Graph + hybrid RAG decision assistant for prior authorization reviewers (POC, synthetic data only)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain-core==1.7.0",
    "langchain-groq==1.1.3",
    "langchain-community==0.4.1",  # 0.4.2 removed chat_models.vertexai, which ragas 0.4.3 imports,
    "langchain-text-splitters==1.1.3",
    "pydantic==2.14.1",
    "pypdf==6.21.2",
    "fpdf2==2.8.9",
    "fastembed==0.9.1",
    "chromadb==1.5.9",
    "rank-bm25==0.2.2",
    "ragas==0.4.3",
    "langsmith==0.14.12",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "streamlit==1.66.1",
    "pandas==3.1.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
